      { niveau: 3, frage: "Zwei Familien verdienen unterschiedlich viel. Welche Aussage ist am besten begründet?",
        antworten: ["Wer mehr verdient, hat immer den höheren Lebensstandard", "Ein hohes Einkommen hilft, doch auch Ausgaben wie Miete und Familiengröße spielen mit", "Das Einkommen hat nie Einfluss", "Wer weniger verdient, ist immer unglücklich"], richtig: 1,
        hinweis: ["Prüfe die Wörter „immer“ und „nie“ kritisch. Was bleibt von einem Einkommen übrig, wenn Miete und Kosten bezahlt sind?", "Vorsicht bei „immer“ und „nie“."],
        erklaerung: "Das Einkommen beeinflusst den Lebensstandard, entscheidend ist aber auch, was man ausgeben muss." },
      { niveau: 3, frage: "Ein Laden wirbt: „Nur heute 50 % Rabatt – nur noch 3 Stück!“ Wie verhältst du dich verantwortungsvoll?",
        antworten: ["Sofort kaufen, sonst ist es weg", "Prüfen, ob man es braucht, Preise vergleichen und den Geldplan beachten", "Auf Kredit von Freunden kaufen", "Mehrere Stück kaufen und weiterverkaufen"], richtig: 1,
        hinweis: ["Wodurch soll hier Druck entstehen? Welche Fragen solltest du dir stellen, bevor du Geld ausgibst?", "Erst nachdenken, dann kaufen."],
        erklaerung: "Zeitdruck und knappe Menge sind Werbetricks. Verantwortungsvoll heißt: Bedarf, Preisvergleich und Budget prüfen." }
    ]
  }
];

const BETRAEGE = [50, 100, 200, 300, 500, 1000, 2000, 4000, 8000, 16000, 32000, 64000, 125000, 500000, 1000000];
const SICHER = [4, 9];   /* Index der Sicherheitsstufen: 500 € und 16.000 € */
/* ============================================================ */

const $ = (s) => document.querySelector(s);
const app = $("#app");
const euro = (n) => n.toLocaleString("de-DE") + " €";
const mischen = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const BUCHST = ["A", "B", "C", "D"];

const startParam = parseInt(new URLSearchParams(location.search).get("stufe"), 10);
const startStufe = [1, 2, 3].includes(startParam) ? startParam : 2;

let S = null;   /* Spielzustand */

function startMenue() {
  S = null;
  app.innerHTML = `
    <div class="card center">
      <p style="font-size:1.1rem;margin:0">Beantworte 15 Fragen und steige Stufe für Stufe auf.<br>Bei 500 € und 16.000 € sicherst du deinen Gewinn.</p>
      <p class="muted" style="margin:10px 0 0">Du hast drei Joker: 50:50, Publikum und Telefon.</p>
      <div class="themen">
        ${THEMEN.map((t, i) => `<button data-i="${i}">${t.name}<small>${t.unter}</small></button>`).join("")}
      </div>
    </div>`;
  app.querySelectorAll("[data-i]").forEach((b) => b.onclick = () => neuesSpiel(THEMEN[+b.dataset.i], startStufe));
}

function neuesSpiel(thema, stufe) {
  S = { thema, stufe, nr: 0, serie: 0, jokerFolge: 0, joker: { fifty: true, publikum: true, telefon: true }, jokerAufFrage: false };
  zeigeFrage();
}

function leiterHtml() {
  return `<div class="leiter" aria-hidden="true">${BETRAEGE.map((_, i) =>
    `<i class="${SICHER.includes(i) ? "sicher " : ""}${i < S.nr ? "fertig" : i === S.nr ? "jetzt" : ""}"></i>`).join("")}</div>`;
}

function zeigeFrage() {
  const f = S.thema.fragen[S.nr];
  S.reihenfolge = mischen([0, 1, 2, 3]);
  S.weg = [];
  S.beantwortet = false;
  S.jokerAufFrage = false;
  const hinweis = S.stufe === 3 ? "" : f.hinweis[S.stufe === 1 ? 0 : 1];
  app.innerHTML = `
    <div class="card">
      <div class="top">
        <span class="muted">Frage ${S.nr + 1} von 15</span>
        <span class="betrag">${euro(BETRAEGE[S.nr])}</span>
      </div>
      ${leiterHtml()}
    </div>
    <div class="card">
      <p class="frage">${f.frage}</p>
      ${hinweis ? `<div class="denk"><b>Denkanstoß</b>${hinweis}</div>` : ""}
      <div class="antworten" id="ant"></div>
      <div id="zusatz"></div>
      <div class="joker" id="joker">
        <button data-j="fifty">50:50</button>
        <button data-j="publikum">Publikum</button>
        <button data-j="telefon">Telefon</button>
        <button class="rechts" id="aussteigen">Aussteigen${S.nr > 0 ? " (" + euro(BETRAEGE[S.nr - 1]) + ")" : ""}</button>
      </div>
    </div>`;
  const ant = $("#ant");
  S.reihenfolge.forEach((orig, pos) => {
    const b = document.createElement("button");
    b.dataset.pos = pos;
    b.innerHTML = `<b>${BUCHST[pos]}:</b>${f.antworten[orig]}`;
    b.onclick = () => waehle(pos);
    ant.appendChild(b);
  });
  app.querySelectorAll("[data-j]").forEach((b) => { b.disabled = !S.joker[b.dataset.j]; b.onclick = () => nutzeJoker(b.dataset.j); });
  $("#aussteigen").onclick = aussteigen;
}

function richtigePos() { return S.reihenfolge.indexOf(S.thema.fragen[S.nr].richtig); }

function nutzeJoker(art) {
  if (S.beantwortet || !S.joker[art]) return;
  S.joker[art] = false;
  S.jokerAufFrage = true;
  const f = S.thema.fragen[S.nr];
  const rp = richtigePos();
  const uebrig = [0, 1, 2, 3].filter((p) => !S.weg.includes(p));
  const zusatz = $("#zusatz");
  if (art === "fifty") {
    const falsche = mischen(uebrig.filter((p) => p !== rp)).slice(0, 2);
    S.weg.push(...falsche);
    falsche.forEach((p) => app.querySelector(`#ant [data-pos="${p}"]`).classList.add("weg"));
  } else if (art === "publikum") {
    const anteile = {};
    let rest = 100;
    const korrekt = 45 + Math.floor(Math.random() * 31);
    anteile[rp] = korrekt; rest -= korrekt;
    const andere = uebrig.filter((p) => p !== rp);
    andere.forEach((p, i) => { const w = i === andere.length - 1 ? rest : Math.floor(Math.random() * (rest + 1)); anteile[p] = w; rest -= w; });
    zusatz.innerHTML = `<div class="info"><b>Das Publikum stimmt ab:</b><div class="balken">${
      [0, 1, 2, 3].map((p) => `<div><span style="height:${(anteile[p] || 0) * 0.8}px"></span>${BUCHST[p]}<br>${anteile[p] || 0} %</div>`).join("")}</div></div>`;
  } else {
    const sicher = [0.85, 0.7, 0.6][f.niveau - 1];
    const tipp = Math.random() < sicher ? rp : mischen(uebrig.filter((p) => p !== rp))[0];
    zusatz.innerHTML = `<div class="info"><b>Deine Freundin am Telefon:</b><br>„Hmm, ich bin mir nicht ganz sicher … ich würde ${BUCHST[tipp]} sagen: ${f.antworten[S.reihenfolge[tipp]]}.“</div>`;
  }
  app.querySelector(`[data-j="${art}"]`).disabled = true;
}

function waehle(pos) {
  if (S.beantwortet || S.weg.includes(pos)) return;
  S.beantwortet = true;
  const f = S.thema.fragen[S.nr];
  const rp = richtigePos();
  const knoepfe = app.querySelectorAll("#ant button");
  knoepfe.forEach((b) => b.disabled = true);
  knoepfe[pos].classList.add("gewaehlt");
  app.querySelectorAll("#joker button").forEach((b) => b.disabled = true);
  setTimeout(() => {
    knoepfe[rp].classList.add("richtig");
    if (pos !== rp) knoepfe[pos].classList.add("falsch");
    knoepfe[pos].classList.remove("gewaehlt");
    if (pos === rp) richtig(f); else falsch(f);
  }, 900);
}

function anpassen() {
  /* Stille Anpassung der Hilfen: 3 sichere richtige Antworten in Folge -> weniger Hilfe,
     Jokereinsatz in zwei Fragen nacheinander -> mehr Hilfe. */
  if (S.jokerAufFrage) { S.serie = 0; S.jokerFolge++; } else { S.serie++; S.jokerFolge = 0; }
  if (S.serie >= 3 && S.stufe < 3) { S.stufe++; S.serie = 0; }
  if (S.jokerFolge >= 2 && S.stufe > 1) { S.stufe--; S.jokerFolge = 0; }
}

function richtig(f) {
  anpassen();
  const letzte = S.nr === 14;
  const gewinn = BETRAEGE[S.nr];
  $("#zusatz").innerHTML = `<div class="info ok"><b>Richtig!</b> ${letzte ? "" : "Du hast jetzt " + euro(gewinn) + "."}<br>${f.erklaerung}</div>`;
  const a = document.createElement("div");
  a.className = "aktion";
  a.innerHTML = `<button id="weiter">${letzte ? "Zum Ergebnis" : "Nächste Frage"}</button>`;
  $("#zusatz").appendChild(a);
  $("#weiter").onclick = () => { if (letzte) ende(gewinn, true); else { S.nr++; zeigeFrage(); } };
}

function falsch(f) {
  let gewinn = 0;
  SICHER.forEach((i) => { if (S.nr > i) gewinn = BETRAEGE[i]; });
  $("#zusatz").innerHTML = `<div class="info nein"><b>Leider falsch.</b> Die richtige Antwort ist markiert.<br>${f.erklaerung}</div>`;
  const a = document.createElement("div");
  a.className = "aktion";
  a.innerHTML = `<button id="weiter">Weiter</button>`;
  $("#zusatz").appendChild(a);
  $("#weiter").onclick = () => ende(gewinn, false);
}

function aussteigen() {
  if (S.beantwortet) return;
  ende(S.nr > 0 ? BETRAEGE[S.nr - 1] : 0, false, true);
}

function ende(gewinn, geschafft, freiwillig) {
  const thema = S.thema;
  const stufeNeu = geschafft ? S.stufe : Math.max(1, S.stufe - (freiwillig ? 0 : 1));
  app.innerHTML = `
    <div class="card center">
      <h2 style="margin:6px 0">${geschafft ? "Du bist Millionär!" : freiwillig ? "Gut ausgestiegen!" : "Das Spiel ist zu Ende"}</h2>
      <div class="gross">${euro(gewinn)}</div>
      <p class="muted">${geschafft ? "Alle 15 Fragen richtig, stark!" : `Du hast ${S.nr + (freiwillig ? 0 : 0)} Fragen richtig beantwortet.`}</p>
      <div class="aktion">
        <button id="nochmal">Nochmal spielen</button>
        <button id="menue">Anderes Thema</button>
      </div>
    </div>`;
  $("#nochmal").onclick = () => neuesSpiel(thema, stufeNeu);
  $("#menue").onclick = startMenue;
}

startMenue();
</script>
</body>
</html>
