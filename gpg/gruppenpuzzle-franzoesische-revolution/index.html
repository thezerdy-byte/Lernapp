<!doctype html>
<html lang="de-DE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gruppenpuzzle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="bilder/icon-fackel.png">
<title>Gruppenpuzzle – Vor der Französischen Revolution</title>
<style>
  /* Farben und Schrift aus der PowerPoint-Vorlage „Die Französische Revolution“ */
  :root {
    --blau: #0B3C7D; --rot: #C8312B; --text: #1F2937; --grau: #7A8699; --dgruen: #2F5233; --hellgruen: #E2EFDA;
    --creme: #FBF5E6; --braun: #8A6D3B; --hellblau: #DCE6F5; --hellgrau: #F3F5F9; --hellrot: #F9E1DF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }   /* iPad: kein Doppeltipp-Zoom */
  button, summary { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  img { -webkit-user-drag: none; }
  body { margin: 0; background: #fff; color: var(--text); font-family: "Century Gothic", "Avenir Next", "Futura", sans-serif; font-size: 17px; line-height: 1.5; }
  #bg { position: fixed; inset: 0; z-index: -1; background: #fff url("bilder/hintergrund.png") center / cover no-repeat; }
  #bg::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: linear-gradient(90deg, var(--blau) 0 33.3%, transparent 33.3% 66.6%, var(--rot) 66.6%); }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .hidden { display: none !important; }
  h1, h2, h3, h4 { color: var(--blau); margin: 0 0 8px; line-height: 1.25; }
  h1 { font-size: 1.75rem; text-align: center; } h2 { font-size: 1.35rem; } h3 { font-size: 1.12rem; }
  p { margin: 0 0 10px; }
  .info { font-size: 20px; }
  .muted { color: var(--grau); }
  .thema { display: inline-block; background: var(--hellgruen); color: var(--dgruen); font-weight: 700; font-size: .85rem; padding: 4px 12px; border-radius: 4px; }
  .eyebrow { color: var(--rot); font-weight: 700; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 4px; }
  .card { background: rgba(255,255,255,.97); border: 2px solid var(--blau); border-radius: 8px; padding: 18px; margin: 0 0 16px; box-shadow: 0 4px 14px rgba(11,60,125,.08); }
  .card.rot { border-color: var(--rot); }
  .card.gruen { background: var(--hellgruen); border-color: var(--dgruen); }
  .card.quelle { background: var(--creme); border-color: var(--braun); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .btn { font-family: inherit; font-size: 1rem; font-weight: 700; min-height: 48px; padding: 10px 22px; border-radius: 8px; border: 2px solid var(--blau); background: #fff; color: var(--blau); cursor: pointer; }
  .btn.primary { background: var(--blau); color: #fff; }
  .btn.rotbtn { background: var(--rot); border-color: var(--rot); color: #fff; }
  .btn.small { min-height: 44px; font-size: .92rem; padding: 8px 16px; }
  .btn:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 3px solid #E8A33D; outline-offset: 2px; }

  /* Kopfleiste mit Timer */
  .top { position: sticky; top: 0; z-index: 20; padding-top: max(10px, env(safe-area-inset-top)) !important; background: rgba(255,255,255,.96); border-bottom: 2px solid var(--hellblau); margin: 0 -16px 14px; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .timer { display: flex; align-items: center; gap: 10px; min-width: 230px; }
  .timer .lbl { font-size: .85rem; font-weight: 700; color: var(--grau); }
  .timer b { font-size: 1.5rem; color: var(--blau); font-variant-numeric: tabular-nums; min-width: 3.2em; }
  .timer .tbar { width: 120px; height: 10px; border-radius: 5px; background: var(--hellblau); overflow: hidden; }
  .timer .tbar div { height: 100%; background: var(--blau); transition: width 1s linear; }
  .timer.knapp b { color: var(--rot); } .timer.knapp .tbar div { background: var(--rot); }
  .timer.aus b { color: var(--rot); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .step { font-family: inherit; font-size: .9rem; font-weight: 700; min-height: 50px; padding: 6px 8px; border-radius: 8px; border: 2px solid var(--blau); background: #fff; color: var(--blau); cursor: pointer; }
  .step.on { background: var(--blau); color: #fff; }
  .step.zu { border-style: dashed; border-color: var(--grau); color: var(--grau); background: var(--hellgrau); cursor: default; }
  .step .n { display: inline-block; width: 1.7em; height: 1.7em; line-height: 1.7em; border-radius: 50%; background: var(--hellblau); color: var(--blau); margin-right: 6px; }

  /* Anmeldung */
  .choices { display: flex; flex-wrap: wrap; gap: 12px; }
  .sym { font-family: inherit; font-size: 2.4rem; width: 86px; height: 86px; border-radius: 10px; border: 2px solid var(--grau); background: #fff; color: var(--blau); cursor: pointer; }
  .sym.on, .role.on { border-color: var(--blau); background: var(--hellblau); box-shadow: 0 0 0 3px var(--blau) inset; }
  .role { font-family: inherit; text-align: left; flex: 1 1 210px; min-height: 92px; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--grau); background: #fff; color: var(--text); cursor: pointer; }
  .role b { display: block; color: var(--blau); font-size: 1.05rem; }
  .role .s { color: var(--grau); font-size: .9rem; }
  img.icon { width: 52px; height: 52px; flex: none; }
  input[type=text] { font-family: inherit; font-size: 1.2rem; padding: 12px 14px; border-radius: 8px; border: 2px solid var(--grau); width: min(100%, 360px); min-height: 50px; color: var(--text); }

  /* Material */
  .head { display: flex; gap: 16px; align-items: center; justify-content: center; text-align: left; }
  .head img.icon { width: 70px; height: 70px; }
  .head h1 { text-align: left; margin: 0; }
  .bilder { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 560px)); justify-content: center; align-items: start; gap: 14px; }
  figure { margin: 0; }
  figure button { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
  figure img { display: block; width: 100%; height: auto; border-radius: 6px; border: 2px solid var(--blau); }
  figure img.oval { border-radius: 50%; border: 0; width: auto; max-width: 100%; max-height: 420px; margin: 0 auto; }
  figcaption { font-size: .9rem; color: var(--text); margin-top: 6px; }
  figcaption .lupe { color: var(--grau); }
  details.bildinfo { margin-top: 6px; font-size: .95rem; }
  details.bildinfo summary { cursor: pointer; color: var(--blau); font-weight: 700; min-height: 44px; display: flex; align-items: center; }
  .quelltext { font-size: 20px; line-height: 1.6; }
  .quelltext p { margin: 0 0 8px; }
  .quelltext .sp { font-weight: 700; color: var(--braun); }
  .qtitel { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .qtitel img { width: 36px; height: 36px; }
  .qhin { font-size: .85rem; color: var(--grau); margin-top: 6px; }
  #lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }

  /* Aufgaben */
  .task h3 { display: flex; gap: 10px; align-items: flex-start; }
  .nr { flex: none; width: 34px; height: 34px; line-height: 34px; text-align: center; border-radius: 50%; background: var(--blau); color: #fff; font-size: 1rem; }
  .card.rot .nr { background: var(--rot); }
  .auftrag { font-size: 20px; margin: 0 0 8px; }
  .hilfe { font-size: .95rem; color: var(--dgruen); background: var(--hellgruen); border-radius: 6px; padding: 6px 10px; display: inline-block; margin-bottom: 8px; }
  .erledigt { color: var(--dgruen); font-weight: 700; font-size: .9rem; margin-left: auto; white-space: nowrap; }
  .plus { display: flex; gap: 12px; align-items: flex-start; }
  .plus .dot { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--rot); color: #fff; font-weight: 700; font-size: 1.5rem; line-height: 40px; text-align: center; }
  textarea { width: 100%; min-height: 110px; font-family: inherit; font-size: 1rem; line-height: 1.5; padding: 12px; border-radius: 8px; border: 2px solid var(--grau); color: var(--text); resize: vertical; background: #fff; }
  textarea.short { min-height: 80px; }

  .feld { display: grid; grid-template-columns: 44px 1fr; gap: 10px; margin: 0 0 14px; }
  .feld .k { width: 40px; height: 40px; line-height: 40px; text-align: center; border-radius: 50%; background: var(--blau); color: #fff; font-weight: 700; }
  .feld.r .k { background: var(--rot); }
  .feld h4 { margin: 2px 0 2px; } .feld .fh { font-size: .92rem; color: var(--grau); margin-bottom: 6px; }

  .bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chip { font-family: inherit; font-size: 1rem; min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 2px solid var(--blau); background: #fff; color: var(--blau); cursor: pointer; font-weight: 700; text-align: left; }
  .chip.used { opacity: .3; }
  .chip.bad { border-color: var(--rot) !important; color: var(--rot) !important; background: var(--hellrot) !important; animation: shake .35s; }
  .chip.sel { background: var(--hellblau); }
  .chip.ok { background: var(--hellgruen); border-color: var(--dgruen); color: var(--dgruen); }
  .chip.no { background: var(--hellrot); border-color: var(--rot); color: var(--rot); }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .gaptext { font-size: 1.05rem; line-height: 2.6; }
  .gap { font-family: inherit; font-size: 1rem; font-weight: 700; min-width: 110px; min-height: 42px; padding: 2px 10px; margin: 0 3px; border-radius: 6px; border: 2px dashed var(--grau); background: #fff; color: var(--blau); cursor: pointer; vertical-align: middle; }
  .gap.full { border-style: solid; border-color: var(--blau); background: var(--hellblau); }
  .gap.ok { border-color: var(--dgruen); background: var(--hellgruen); color: var(--dgruen); }
  .gap.no { border-color: var(--rot); background: var(--hellrot); color: var(--rot); }

  .mlist { display: grid; gap: 8px; margin: 10px 0; }
  .mrow { font-family: inherit; font-size: 1.05rem; line-height: 1.5; text-align: left; min-height: 48px; padding: 10px 14px; border-radius: 8px; border: 2px solid transparent; background: var(--creme); color: var(--text); cursor: pointer; }
  .mrow .sp { font-weight: 700; color: var(--braun); }
  .mrow.sel { background: #FFF1A8; border-color: #E0B800; }
  .mrow.ok { background: var(--hellgruen); border-color: var(--dgruen); }
  .mrow.no { background: var(--hellrot); border-color: var(--rot); }
  .mrow.bad { animation: shake .35s; border-color: var(--rot); }

  .kette { display: grid; gap: 8px; margin: 10px 0; }
  .kette .it { display: grid; grid-template-columns: 100px 1fr; gap: 10px; align-items: center; min-height: 52px; padding: 8px 12px; border: 2px dashed var(--grau); border-radius: 8px; background: #fff; font-family: inherit; font-size: 1rem; text-align: left; color: var(--text); cursor: pointer; }
  .kette .it .lab { font-weight: 700; color: var(--blau); font-size: .9rem; }
  .kette .it.full { border-style: solid; border-color: var(--blau); }
  .kette .it.ok { border-color: var(--dgruen); background: var(--hellgruen); }
  .kette .it.no { border-color: var(--rot); background: var(--hellrot); }
  .sortlist { display: grid; gap: 10px; margin: 10px 0; }
  .sortrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; border: 2px solid var(--hellblau); border-radius: 8px; padding: 10px 12px; background: #fff; }
  .sortrow .bt { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .sortrow .chip { font-size: .9rem; padding: 6px 12px; }
  .sortrow.ok { border-color: var(--dgruen); background: var(--hellgruen); } .sortrow.no { border-color: var(--rot); background: var(--hellrot); }
  .msg { font-weight: 700; margin: 8px 0 0; }
  .msg.ok { color: var(--dgruen); } .msg.no { color: var(--rot); }

  /* Check */
  .q { border: 2px solid var(--hellblau); border-radius: 8px; padding: 14px; margin: 0 0 12px; background: #fff; }
  .q .qt { font-weight: 700; margin-bottom: 10px; }
  .opts { display: grid; gap: 8px; }
  .opt { font-family: inherit; font-size: 1rem; text-align: left; min-height: 48px; padding: 10px 14px; border-radius: 8px; border: 2px solid var(--grau); background: #fff; color: var(--text); cursor: pointer; }
  .opt:disabled { cursor: default; color: var(--text); }
  .opt.ok { border-color: var(--dgruen); background: var(--hellgruen); }
  .opt.no { border-color: var(--rot); background: var(--hellrot); }
  .why { margin-top: 8px; font-size: .95rem; color: var(--grau); }
  .banner { border-radius: 8px; padding: 14px 16px; font-weight: 700; font-size: 1.15rem; margin: 6px 0 14px; }
  .banner.ok { background: var(--hellgruen); color: var(--dgruen); border: 2px solid var(--dgruen); }
  .banner.no { background: var(--hellrot); color: var(--rot); border: 2px solid var(--rot); }
  .fehlt { margin: 6px 0 0; padding-left: 20px; }
  .weiter { text-align: center; }
  .weiter .btn { font-size: 1.15rem; min-height: 56px; padding: 12px 28px; }

  /* Großer Bildschirm Expertengruppe */
  .hero { background: var(--blau); color: #fff; border-radius: 10px; padding: clamp(22px, 5vw, 46px) 20px; text-align: center; margin: 0 0 16px; position: relative; overflow: hidden; }
  .hero h1 { color: #fff; font-size: clamp(2rem, 5.4vw, 3.2rem); margin: 6px 0 10px; }
  .hero .eyebrow { color: #F6B8B3; }
  .hero .big { font-size: clamp(3.6rem, 13vw, 7.5rem); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; margin: 10px 0; }
  .hero .big.aus { color: #F6B8B3; animation: blink 1s steps(2) infinite; }
  .hero ol { text-align: left; max-width: 640px; margin: 14px auto 0; font-size: 20px; line-height: 1.5; padding-left: 28px; }
  .hero ol li { margin-bottom: 8px; }
  .hero .disk { background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.5); border-radius: 8px; padding: 12px 14px; margin-top: 4px; font-weight: 700; }
  .hero.finde { min-height: calc(100vh - 170px); min-height: calc(100dvh - 170px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .riesig { width: 100%; text-align: center; font-size: clamp(4rem, 13vw, 8.5rem); font-weight: 700; line-height: 1.05; color: #fff; margin: 6px 0 14px; word-break: break-word; }
  .riesig.symbol { line-height: 0; margin: 10px 0 16px; }
  .riesig.symbol svg { width: clamp(150px, 30vw, 260px); height: auto; color: #fff; }
  .sym svg.symg { width: 46px; height: 46px; color: var(--blau); }
  .hero img.rolle { width: clamp(100px, 16vw, 150px); height: auto; filter: brightness(0) invert(1); }
  .fsatz { font-size: 22px; max-width: 660px; margin: 0 auto 8px; line-height: 1.45; }
  .fsatz.klein { font-size: 18px; opacity: .85; }
  .finde .big { font-size: clamp(2.6rem, 8vw, 4.2rem); margin: 8px 0 14px; }
  .btn.hellbtn { background: #fff; color: var(--blau); border-color: #fff; font-size: 1.1rem; min-height: 56px; }
  .hero img.deko { position: absolute; width: 120px; opacity: .12; filter: brightness(0) invert(1); }
  .ov h4 { margin: 10px 0 4px; }
  .ans { white-space: pre-wrap; background: var(--hellgrau); border: 1px solid var(--hellblau); border-radius: 6px; padding: 10px 12px; margin: 0 0 10px; }
  .line { margin: 0 0 14px; }
  .built { min-height: 50px; padding: 10px 12px; border: 2px dashed var(--grau); border-radius: 8px; margin: 8px 0; background: #fff; }
  .built.full { border-style: solid; border-color: var(--dgruen); background: var(--hellgruen); }

  /* Gruppenblatt */
  .tbl { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  .tbl th, .tbl td { border: 1.5px solid var(--hellblau); padding: 10px; vertical-align: top; font-size: .95rem; background: #fff; }
  .tbl th { background: var(--hellgrau); color: var(--blau); text-align: left; }
  .tbl th.rowh { width: 15%; }
  .tbl td.own, .tbl th.own { background: var(--hellgruen); }
  .tbl .chip { font-size: .85rem; padding: 6px 10px; }
  .tags { display: flex; flex-direction: column; gap: 6px; margin: 4px 0; }
  .tag { font-family: inherit; text-align: left; font-size: .9rem; min-height: 44px; padding: 6px 10px; border-radius: 8px; border: 2px solid var(--dgruen); background: var(--hellgruen); color: var(--text); cursor: pointer; }
  .zuf { display: grid; gap: 6px; }
  .zuf .chip { font-size: .85rem; padding: 6px 8px; text-align: center; }
  .zuf .chip.sel { background: var(--blau); color: #fff; }
  .ownt { white-space: pre-wrap; }
  details.col { border: 2px solid var(--blau); border-radius: 8px; margin: 0 0 12px; background: #fff; overflow: hidden; }
  details.col summary { cursor: pointer; padding: 14px 16px; min-height: 50px; font-weight: 700; color: var(--blau); display: flex; align-items: center; gap: 10px; }
  details.col.own { border-color: var(--dgruen); } details.col.own summary { background: var(--hellgruen); }
  details.col .body { padding: 0 16px 14px; }
  details.col .cell { margin: 0 0 14px; }
  details.col .cell h4 { margin: 0 0 6px; font-size: .95rem; color: var(--grau); }

  /* Druck: genau eine A4-Seite */
  #printArea { display: none; color: #000; font-size: 10.5pt; line-height: 1.35; }
  #printArea.mess { display: block; position: absolute; left: -10000px; top: 0; width: 186mm; }
  #printArea .pp { break-inside: avoid; }
  #printArea .pp { font-size: 10.5pt; }            /* wird beim Drucken bei Bedarf verkleinert, alle Maße in em */
  #printArea h2 { color: #000; font-size: 1.24em; margin: .3em 0 .6em; text-align: left; }
  #printArea h3 { color: #000; font-size: 1.05em; margin: .8em 0 .25em; }
  #printArea .ans { white-space: pre-wrap; border: 1px solid #000; padding: .4em .7em; margin: 0 0 .5em; border-radius: 0; background: none; font-size: 1em; }
  #printArea table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  #printArea th, #printArea td { border: 1px solid #000; padding: .35em .45em; vertical-align: top; font-size: .86em; background: none !important; color: #000; }
  #printArea th.rowh { width: 16%; }
  #printArea .pn { display: flex; justify-content: space-between; gap: 10px; border-bottom: 2px solid #000; margin-bottom: .5em; padding-bottom: .3em; font-weight: bold; }
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    html, body { background: #fff !important; }
    #app, #bg, #lightbox { display: none !important; }
    #printArea { display: block; }
  }
  @media (max-width: 900px) { .timer { min-width: 0; } .timer .lbl { display: none; } .timer .tbar { width: 80px; } }
  @media (max-width: 700px) { .timer .tbar { display: none; } .steps .step .t { display: none; } }
</style>
</head>
<body>
<div id="bg"></div>
<div id="app" class="wrap"></div>
<div id="printArea"></div>
<div id="lightbox" class="hidden"></div>
<script>
/* =====================================================================
   INHALTE – hier kann die Lehrkraft alles ändern.
   Symbole der Schüler (steuern unauffällig die Hilfen):
     "k" = Kreis ●   Antippen mit sofortiger Rückmeldung, Wortspeicher, Auswahl
     "q" = Quadrat ■ Satzanfänge im Textfeld, Anzahl-Hinweise, Prüfen-Knopf
     "t" = Dreieck ▲ leere Textfelder, keine Anzahl-Hinweise, Prüfen-Knopf
   Aufgabentypen (typ):
     "bild"      Bildbetrachtung „Ich sehe – Ich denke – Das bedeutet“
                 felder: [{ label, hint, starter, options:[…], correct: Position oder null (offen) }]
     "mark"      Sätze im Text antippen. text: Nummer des Textes, correct: [Satznummern ab 0]
     "order"     Karten in Reihenfolge antippen. items: [… richtige Reihenfolge …], labels: optional
     "sort"      Karten zwei Spalten zuordnen. cols: [..], items: [{ t, c: 0|1 }]
     "schreiben" ● Lückentext (kreis), ■ Textfeld mit starter, ▲ leeres Textfeld
   Texte: zeilen = Sätze (oder { s: Sprecher, t: Text }). inTask: true = Text erscheint in der Markier-Aufgabe.
   Bilder: aus dem Schulbuch S. 48–51 (historische Gemälde), Texte frei nacherzählt.
   ===================================================================== */
const CONTENT = {
  titel: "Gruppenpuzzle – Vor der Französischen Revolution",
  thema: "Vor der Französischen Revolution",
  minuten: { 1: 11, 3: 6, 5: 18 },                    // stiller Timer: geplante Arbeitszeit je Phase (Minuten), wird nicht angezeigt
  freiAb: 0.4,                                       // nach 40 % dieser Zeit darf man weiter, auch wenn noch nicht alles fertig ist

/* ---------- Gerüst ---------- */
function render() {
  const y = window.scrollY, ae = document.activeElement;
  const fokus = ae && ae.dataset && ae.dataset.k ? { k: ae.dataset.k, a: ae.selectionStart, b: ae.selectionEnd } : null; // Schreibfokus über das Neuzeichnen retten
  tbN = 0;
  $app.innerHTML = "";
  if (!st.started || !st.name.trim() || !st.sym || !st.role) { $app.append(loginView()); return; }
  freischalten();
  if (st.step > st.unlocked) st.step = st.unlocked;
  if (CONTENT.minuten[st.step] && !st.t[st.step]) { st.t[st.step] = Date.now(); save(); }
  const s = st.step;
  $app.append(h("div", { class: "top" }, h("span", { class: "thema", text: "Stundenthema: " + CONTENT.thema }),
    h("button", { class: "btn small", type: "button", onclick: () => { if (confirm("Wirklich neu beginnen? Alle deine Antworten auf diesem iPad werden gelöscht.")) { st = fresh(); done(); } } }, "Neu beginnen")),
    h("nav", { class: "steps", "aria-label": "Teile" }, CONTENT.navi.map((nr, i) => {

      return h("button", { class: "step" + (on ? " on" : "") + (frei ? "" : " zu"), type: "button", disabled: !frei, "aria-current": on ? "step" : "false", "aria-label": frei ? "Teil " + (i + 1) + ": " + n : "Teil " + (i + 1) + " (noch gesperrt)", onclick: () => gehe(nr) },
        h("span", { class: "n", text: frei ? i + 1 : "🔒" }), frei ? h("span", { class: "t", text: n }) : null);
    })),
    s === 1 ? teil1View() : s === 2 ? findeView(false) : s === 3 ? teil2View() : s === 4 ? findeView(true) : s === 5 ? teil3View() : teil4View());
  window.scrollTo(0, y);
  if (fokus) { const t = $app.querySelector('[data-k="' + fokus.k + '"]'); if (t) { t.focus({ preventScroll: true }); try { t.setSelectionRange(fokus.a, fokus.b); } catch (e) {} } }
  tick();
}
