<!doctype html>
<html lang="de-DE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gruppenpuzzle – Vor der Französischen Revolution</title>
<style>
  :root {
    --blau: #1F3A5F; --rot: #B7352D; --gruen: #2F7D4F; --hellgruen: #E2EFDA; --linie: #C9D3C3; --text: #1F2A37; --grau: #3B4756;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #fff; color: var(--text); font-family: "Century Gothic", "Avenir Next", "Futura", sans-serif; font-size: 17px; line-height: 1.5; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 14px 16px 60px; }
  .hidden { display: none !important; }
  .eyebrow { color: var(--rot); font-weight: 700; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 4px; }
  h1, h2, h3 { color: var(--blau); margin: 0 0 8px; line-height: 1.25; }
  h1 { font-size: 1.7rem; } h2 { font-size: 1.35rem; } h3 { font-size: 1.1rem; }
  p { margin: 0 0 10px; }
  .info { font-size: 20px; }
  .muted { color: var(--grau); }
  .card { background: #fff; border: 1.5px solid var(--linie); border-radius: 16px; padding: 18px; margin: 0 0 16px; }
  .card.main { background: var(--hellgruen); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .btn { font-family: inherit; font-size: 1rem; font-weight: 700; min-height: 46px; padding: 10px 20px; border-radius: 12px; border: 2px solid var(--blau); background: #fff; color: var(--blau); cursor: pointer; }
  .btn.primary { background: var(--blau); color: #fff; }
  .btn.small { min-height: 44px; font-size: .9rem; padding: 8px 14px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible, .chip:focus-visible, .gap:focus-visible, textarea:focus-visible, input:focus-visible, .opt:focus-visible { outline: 3px solid #E8A33D; outline-offset: 2px; }

  /* Navigation */
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .top .titel { font-weight: 700; color: var(--blau); }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .step { font-family: inherit; font-size: .95rem; font-weight: 700; min-height: 48px; padding: 8px 10px; border-radius: 12px; border: 1.5px solid var(--linie); background: #fff; color: var(--grau); cursor: pointer; }
  .step.on { background: var(--blau); border-color: var(--blau); color: #fff; }
  .step b { display: inline-block; width: 1.6em; height: 1.6em; line-height: 1.6em; border-radius: 50%; background: var(--hellgruen); color: var(--blau); margin-right: 6px; }

  /* Anmeldung */
  .choices { display: flex; flex-wrap: wrap; gap: 12px; }
  .sym { font-family: inherit; font-size: 2.4rem; width: 86px; height: 86px; border-radius: 16px; border: 2px solid var(--linie); background: #fff; color: var(--blau); cursor: pointer; }
  .sym.on, .role.on { border-color: var(--blau); background: var(--hellgruen); box-shadow: 0 0 0 3px var(--blau) inset; }
  .role { font-family: inherit; text-align: left; flex: 1 1 220px; min-height: 96px; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--linie); background: #fff; color: var(--text); cursor: pointer; }
  .role b { display: block; color: var(--blau); font-size: 1.05rem; }
  .role span.s { color: var(--grau); font-size: .9rem; }
  input[type=text] { font-family: inherit; font-size: 1.2rem; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--linie); width: min(100%, 360px); min-height: 48px; color: var(--text); }
  svg.icon { width: 56px; height: 56px; flex: none; fill: none; stroke: var(--blau); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

  /* Aufgaben */
  .head { display: flex; gap: 14px; align-items: center; }
  .head svg.icon { width: 72px; height: 72px; }
  .task h3 { font-size: 1.1rem; }
  .task h3 .n { display: inline-block; min-width: 1.5em; color: var(--rot); }
  .ref { display: inline-block; font-size: .82rem; font-weight: 700; color: var(--grau); background: #F1F4EF; border: 1px solid var(--linie); border-radius: 999px; padding: 2px 10px; margin-bottom: 8px; }
  .plus { display: flex; gap: 12px; align-items: flex-start; }
  .plus .dot { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--rot); color: #fff; font-weight: 700; font-size: 1.5rem; line-height: 40px; text-align: center; }
  textarea { width: 100%; min-height: 120px; font-family: inherit; font-size: 1rem; line-height: 1.5; padding: 12px; border-radius: 12px; border: 2px solid var(--linie); color: var(--text); resize: vertical; background: #fff; }
  textarea.short { min-height: 84px; }

  .bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chip { font-family: inherit; font-size: 1rem; min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 2px solid var(--blau); background: #fff; color: var(--blau); cursor: pointer; font-weight: 700; }
  .chip.used { opacity: .35; }
  .chip.bad { border-color: var(--rot); color: var(--rot); animation: shake .35s; }
  .chip.sel { background: var(--hellgruen); }
  .chip.ok { background: var(--hellgruen); border-color: var(--gruen); color: var(--gruen); }
  .chip.no { background: #FBE9E7; border-color: var(--rot); color: var(--rot); }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .gaptext { font-size: 1.05rem; line-height: 2.5; }
  .gap { font-family: inherit; font-size: 1rem; font-weight: 700; min-width: 110px; min-height: 40px; padding: 2px 10px; margin: 0 3px; border-radius: 8px; border: 2px dashed var(--grau); background: #fff; color: var(--blau); cursor: pointer; vertical-align: middle; }
  .gap.full { border-style: solid; border-color: var(--blau); background: #F1F6FF; }
  .gap.ok { border-color: var(--gruen); background: var(--hellgruen); color: var(--gruen); }
  .gap.no { border-color: var(--rot); background: #FBE9E7; color: var(--rot); }
  .seq { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .seq .it { display: flex; gap: 10px; align-items: center; min-height: 44px; padding: 8px 12px; border: 2px dashed var(--grau); border-radius: 12px; background: #fff; font-family: inherit; font-size: 1rem; text-align: left; color: var(--text); cursor: pointer; }
  .seq .it.full { border-style: solid; border-color: var(--blau); }
  .seq .it.ok { border-color: var(--gruen); background: var(--hellgruen); }
  .seq .it.no { border-color: var(--rot); background: #FBE9E7; }
  .seq .it b { flex: none; width: 1.8em; height: 1.8em; line-height: 1.8em; text-align: center; border-radius: 50%; background: var(--hellgruen); color: var(--blau); }
  .sortlist { display: grid; gap: 10px; margin: 10px 0; }
  .sortrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; border: 1.5px solid var(--linie); border-radius: 12px; padding: 10px 12px; }
  .sortrow .bt { display: flex; flex-wrap: wrap; gap: 8px; }
  .sortrow.ok { border-color: var(--gruen); background: var(--hellgruen); } .sortrow.no { border-color: var(--rot); background: #FBE9E7; }
  .msg { font-weight: 700; margin: 8px 0 0; }
  .msg.ok { color: var(--gruen); } .msg.no { color: var(--rot); }

  /* Check */
  .q { border: 1.5px solid var(--linie); border-radius: 14px; padding: 14px; margin: 0 0 12px; background: #fff; }
  .q .qt { font-weight: 700; margin-bottom: 10px; }
  .opts { display: grid; gap: 8px; }
  .opt { font-family: inherit; font-size: 1rem; text-align: left; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--linie); background: #fff; color: var(--text); cursor: pointer; }
  .opt.ok { border-color: var(--gruen); background: var(--hellgruen); }
  .opt.no { border-color: var(--rot); background: #FBE9E7; }
  .why { margin-top: 8px; font-size: .95rem; color: var(--grau); }
  .banner { border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 1.15rem; margin: 6px 0 14px; }
  .banner.ok { background: var(--hellgruen); color: var(--gruen); border: 1.5px solid var(--gruen); }
  .banner.no { background: #FBE9E7; color: var(--rot); border: 1.5px solid var(--rot); }
  .line { margin: 0 0 14px; }
  .line h4 { margin: 0 0 6px; color: var(--blau); }
  .built { min-height: 48px; padding: 10px 12px; border: 2px dashed var(--grau); border-radius: 12px; margin: 8px 0; background: #fff; }
  .built.full { border-style: solid; border-color: var(--gruen); background: var(--hellgruen); }

  /* Gruppenblatt */
  .tbl { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  .tbl th, .tbl td { border: 1.5px solid var(--linie); padding: 10px; vertical-align: top; font-size: .95rem; }
  .tbl th { background: #F1F4EF; color: var(--blau); text-align: left; }
  .tbl th.rowh { width: 15%; }
  .tbl td.own, .tbl th.own { background: var(--hellgruen); }
  .tbl .bank { margin: 6px 0; } .tbl .chip { font-size: .85rem; padding: 6px 10px; min-height: 44px; }
  .tags { display: flex; flex-direction: column; gap: 6px; margin: 4px 0; }
  .tag { font-family: inherit; text-align: left; font-size: .9rem; min-height: 44px; padding: 6px 10px; border-radius: 10px; border: 1.5px solid var(--gruen); background: var(--hellgruen); color: var(--text); cursor: pointer; }
  .zuf { display: grid; gap: 6px; }
  .zuf .chip { font-size: .85rem; padding: 6px 8px; }
  .zuf .chip.sel { background: var(--blau); color: #fff; }
  details.col { border: 1.5px solid var(--linie); border-radius: 14px; margin: 0 0 12px; background: #fff; overflow: hidden; }
  details.col summary { cursor: pointer; padding: 14px 16px; min-height: 48px; font-weight: 700; color: var(--blau); display: flex; align-items: center; gap: 10px; }
  details.col.own summary { background: var(--hellgruen); }
  details.col .body { padding: 0 16px 14px; }
  details.col .cell { margin: 0 0 14px; }
  details.col .cell h4 { margin: 0 0 6px; font-size: .95rem; color: var(--grau); }

  /* Übersicht */
  .sum h3 { margin-top: 6px; } .sum .ans { white-space: pre-wrap; background: #F7F9F5; border: 1px solid var(--linie); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }

  .ans-own { white-space: pre-wrap; }
  #printArea { display: none; }
  @media print {
    @page { size: A4; margin: 14mm; }
    body { font-size: 11pt; color: #000; }
    #app { display: none !important; }
    #printArea { display: block; }
    .pp { page-break-after: always; break-after: page; }
    .pp:last-child { page-break-after: auto; break-after: auto; }
    #printArea h1, #printArea h2, #printArea h3, #printArea h4 { color: #000; }
    #printArea .ans { white-space: pre-wrap; border: 1px solid #000; padding: 6px 8px; margin: 0 0 8px; border-radius: 0; background: none; }
    #printArea table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    #printArea th, #printArea td { border: 1px solid #000; padding: 6px; vertical-align: top; font-size: 10pt; background: none !important; }
    #printArea .pn { display: flex; justify-content: space-between; border-bottom: 2px solid #000; margin-bottom: 10px; padding-bottom: 4px; font-weight: bold; }
  }
  @media (max-width: 600px) { .wrap { padding: 10px 10px 50px; } h1 { font-size: 1.4rem; } }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="printArea"></div>
<script>
/* =====================================================================
   INHALTE – hier kann die Lehrkraft alles ändern.
   Symbole der Schüler: "k" = Kreis ●, "q" = Quadrat ■, "t" = Dreieck ▲
     ● Kreis:    Wortspeicher / Lückentext / Zuordnung zum Antippen  (Feld "kreis" der Aufgabe)
     ■ Quadrat:  Textfeld mit Satzanfängen                          (Feld "starter")
     ▲ Dreieck:  leeres Textfeld
   Aufgabe: { kopf, detail, ref, starter, kreis }
   kreis-Typen:
     { typ:"gap",   text:"… {0} … {1} …", words:[…], sol:[…] }   Lückentext (sol = null: offene Lücken, nicht geprüft)
     { typ:"order", items:[… in richtiger Reihenfolge …] }        Reihenfolge antippen
     { typ:"pick",  options:[…], correct:[Positionen] }          passende Karten antippen
     { typ:"sort",  cols:["…","…"], items:[{t:"…", c:0|1}] }    zwei Spalten zuordnen
   Check: { typ:"mc", q, options:[…], correct:Position, why } oder { typ:"tf", q, correct:true|false, why }
   Spickzettel: { label, starter, parts:[Bausteine in richtiger Reihenfolge], wrong:"falscher Baustein" }
   Gruppenblatt-Zellen (cells): { right:[richtige Bausteine], wrong:[falsche Bausteine], starter }
   ===================================================================== */
const CONTENT = {
  titel: "Gruppenpuzzle – Vor der Französischen Revolution",
  reihenfolge: ["B", "A", "C", "D"],           // Reihenfolge der Spalten im Gruppenblatt
  zeilen: ["Wie lebt sie/er?", "Lasten oder Vorrechte?", "Was denkt sie/er über König und Ordnung?", "Zufrieden?"],
  zufrieden: ["zufrieden", "teils", "unzufrieden"],
  fazit: {
    vorne: "Viele Menschen in Frankreich waren unzufrieden, weil",
    kreis: { typ: "gap", text: "Viele Menschen in Frankreich waren unzufrieden, weil {0} und {1} viele {2} hatten und keine {3} zahlten. Die Bauern litten oft {4}. Das fanden sie {5}. Sie wollten {6} und {7} sein.",
      words: ["Steuern", "Vorrechte", "Adel", "Kirche", "Hunger", "ungerecht", "frei", "gleich"],
      sol: ["Adel", "Kirche", "Vorrechte", "Steuern", "Hunger", "ungerecht", "frei", "gleich"] }
  },
  stammPlus: "Wer von den vier Personen würde 1789 am ehesten mitkämpfen? Begründe.",
  stammPlusStarter: "Am ehesten würde … mitkämpfen, weil …",

  rollen: {
    A: { name: "Ein Bauer", seite: "S. 48", material: "Bild [1] (Gemälde von 1642) und Text [2]", icon: "aehre", zufrieden: "unzufrieden",
      tasks: [
        { kopf: "Beschreibe die Menschen auf Bild [1].", detail: "Achte auf Gesichtsausdruck (niedergeschlagen / hoffnungsvoll / trotzig), Kleidung, Körperhaltung und Umgebung.", ref: "Bild [1], S. 48",
          starter: "Die Menschen auf dem Bild sehen … aus.\nIhre Kleidung ist …\nIhre Körperhaltung wirkt …\nUm sie herum sieht man …",
          kreis: { typ: "gap", text: "Die Menschen auf dem Bild sehen {0} aus. Ihre Kleidung ist {1}. Ihre Körperhaltung wirkt {2}. Um sie herum sieht man {3}.",
            words: ["niedergeschlagen", "hoffnungsvoll", "trotzig", "müde", "einfach", "zerlumpt", "gebeugt", "aufrecht", "Felder", "ein Haus", "Tiere"], sol: null } },
        { kopf: "Nenne die Lasten des Bauern.", detail: "Lies Text [2] und finde alle Lasten.", ref: "Text [2], S. 48",
          starter: "Der Bauer muss …\nAußerdem muss er …\nEr darf nicht …\nSeine Heirat …",
          kreis: { typ: "pick", options: ["Steuern für den König zahlen", "100 Tage im Jahr Straßen bauen", "Einen Teil der Ernte an den Grundherrn abgeben", "2–3-mal pro Woche auf dem Feld des Grundherrn arbeiten und Holz hacken", "Frösche von den Feldern des Grundherrn verscheuchen", "Nicht jagen dürfen, obwohl Tiere die Felder leer fressen", "Nur mit Erlaubnis und gegen Geld heiraten dürfen", "Keine Steuern zahlen müssen", "Heiraten, wen er will"], correct: [0, 1, 2, 3, 4, 5, 6], hint: "Es gibt sieben Lasten. Zwei Karten passen nicht." } },
        { kopf: "Erkläre, warum der Bauer unzufrieden ist.", detail: "Nutze deine Antworten aus Aufgabe 2.", ref: "Text [2]",
          starter: "Der Bauer ist unzufrieden, weil …",
          kreis: { typ: "gap", text: "Der Bauer ist unzufrieden, weil er viele {0} zahlen muss. Einen Teil der {1} muss er an den {2} abgeben. Außerdem muss er für ihn {3}. Er darf nicht {4}, obwohl Tiere seine Felder leer fressen. Er ist {5} und hat oft {6}.",
            words: ["Steuern", "Grundherr", "Ernte", "arbeiten", "jagen", "unfrei", "Hunger"], sol: ["Steuern", "Ernte", "Grundherr", "arbeiten", "jagen", "unfrei", "Hunger"] } }
      ],
      plus: { text: "Das Bild ist von 1642. Erkläre, warum es trotzdem zur Zeit vor 1789 passt.", starter: "Das Bild passt zur Zeit vor 1789, weil …" },
      check: [
        { typ: "mc", q: "Wer durfte auf den Feldern jagen?", options: ["Der Bauer", "Der Grundherr", "Der Pfarrer"], correct: 1, why: "Nur der Grundherr durfte jagen. Der Bauer musste zusehen, wie Tiere seine Felder leer fraßen." },
        { typ: "mc", q: "Wie viele Tage im Jahr musste der Bauer an Straßen bauen?", options: ["30 Tage", "100 Tage", "200 Tage"], correct: 1, why: "Er musste 100 Tage im Jahr unbezahlt Straßen bauen." },
        { typ: "mc", q: "Der Bauer gehört zum … Stand.", options: ["Ersten", "Zweiten", "Dritten"], correct: 2, why: "Der Erste Stand ist die Kirche, der Zweite der Adel, der Dritte alle anderen, auch die Bauern." },
        { typ: "tf", q: "Der Bauer durfte heiraten, wen er wollte.", correct: false, why: "Er durfte nur mit Erlaubnis des Grundherrn und gegen Geld heiraten." }
      ],
      spick: [

    B: { name: "Eine adlige Dame", seite: "S. 50", material: "Text [1], Z. 1–20, Bild [2] (1740) und Bild [3] (1862)", icon: "krone", zufrieden: "zufrieden",

        { kopf: "Nenne die Vorrechte des Adels.", detail: "Lies Text [1], Z. 15–20.", ref: "Text [1], Z. 15–20",

          kreis: { typ: "gap", text: "Die Adlige findet ihre Vorrechte richtig, weil {0} die Ordnung so festgelegt hat. Deshalb muss sie keine {1} zahlen und nicht {2}. Sie ist zum {3} geboren.",
            words: ["Gott", "Steuern", "arbeiten", "Herrschen", "Bauern", "frei"], sol: ["Gott", "Steuern", "arbeiten", "Herrschen"] } }
      ],
      plus: { text: "Bild [3] wurde 1862 gemalt. Ist es eine Quelle aus der Zeit oder eine spätere Darstellung? Begründe.", starter: "Bild [3] ist … Ich erkenne das daran, dass …" },
      check: [
        { typ: "mc", q: "Wo lebt die Adlige?", options: ["Auf einem Bauernhof", "Am Hof von Versailles", "In einem Mietshaus in Paris"], correct: 1, why: "Sie lebt am Hof von Versailles und hilft der Königin beim Ankleiden." },

      ],
      spick: [
        { label: "Wie lebt die Adlige?", starter: "Die Adlige lebt …", parts: ["Die Adlige lebt", "am Hof von Versailles", "und hat Dienerinnen,", "Feste und Vergnügen."], wrong: "auf dem Land" },

function h(tag, props, ...kids) {
  const e = document.createElement(tag);

    const v = props[k];
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else if (k === "html") e.innerHTML = v;

  });

  return e;
}

/* Lückentext mit Wortspeicher */
function gapWidget(store, key, spec) {
  const a = slot(store, key, { fill: {}, checked: false });
  const n = (spec.text.split(/\{\d+\}/).length - 1);
  const parts = spec.text.split(/\{(\d+)\}/);
  const p = h("p", { class: "gaptext" });
  parts.forEach((s, i) => {
    if (i % 2 === 0) { p.append(s); return; }
    const g = +s, has = g in a.fill;
    let cls = "gap" + (has ? " full" : "");
    if (a.checked && spec.sol && has) cls += spec.words[a.fill[g]] === spec.sol[g] ? " ok" : " no";
    p.append(h("button", { class: cls, type: "button", "aria-label": "Lücke " + (g + 1), onclick: () => { if (has) { delete a.fill[g]; a.checked = false; done(); } } }, has ? spec.words[a.fill[g]] : " "));
  });
  const used = Object.values(a.fill);
  const bank = h("div", { class: "bank" }, mix(spec.words.length, key).map(i =>
    h("button", { class: "chip" + (used.includes(i) ? " used" : ""), type: "button", onclick: () => {
      if (used.includes(i)) return;

    } }, spec.words[i])));
  const out = h("div", {}, p, bank);

    out.append(h("button", { class: "btn small", type: "button", disabled: !full, onclick: () => { a.checked = true; done(); } }, "Prüfen"));
    if (a.checked) {

      out.append(ok ? msg(true, "Richtig! ✔") : msg(false, "Noch nicht ganz. Tippe auf eine rote Lücke, um sie zu leeren, und probiere es noch einmal."));
    }
  }
  return out;
}
