<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BUZZER</title>
<style>
  :root { --t1: #e8743b; --t2: #2fa6c9; --gold: #f3d37a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }
  body {
    display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; color: #fff;
    font-family: Impact, "Arial Narrow Bold", "Haettenschweiler", "Franklin Gothic Condensed", "Arial Black", sans-serif;
  }
  .hidden { display: none !important; }
  h1 { margin: 0; padding: 14px 0 6px; text-align: center; font-size: clamp(1.8rem, 7vmin, 3.4rem); font-weight: 400; letter-spacing: .05em; color: var(--gold); }
  #pick { flex: 1; display: flex; flex-direction: column; }
  #pick .row { flex: 1; display: flex; gap: 12px; padding: 12px; }
  .choice { flex: 1; border: 0; border-radius: 18px; color: #fff; font-family: inherit; font-size: clamp(2rem, 9vmin, 5rem); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; text-shadow: 0 3px 0 rgba(0,0,0,.5); }
  .choice.t1 { background: var(--t1); } .choice.t2 { background: var(--t2); }
  .choice:active { filter: brightness(.9); }
  #play { flex: 1; display: flex; flex-direction: column; }
  #big {
    flex: 1; margin: 12px; border: 0; border-radius: 26px; color: #fff; font-family: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    font-size: clamp(3rem, 16vmin, 9rem); letter-spacing: .05em; text-shadow: 0 4px 0 rgba(0,0,0,.5);
    box-shadow: inset 0 -14px 0 rgba(0,0,0,.25); transition: transform .06s, filter .15s;
  }
  #big small { font-size: clamp(1rem, 4vmin, 2rem); letter-spacing: .08em; opacity: .9; }
  #big:active:not(:disabled) { transform: scale(.98); }
  #big:disabled { filter: brightness(.5); cursor: default; }
  .foot { text-align: center; padding: 0 0 12px; }
  .foot button, .foot a { font-family: system-ui, sans-serif; font-weight: 700; font-size: .95rem; padding: 9px 22px; border-radius: 999px; border: 2px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; text-decoration: none; margin: 0 4px; }
  .note { font-family: system-ui, sans-serif; font-size: .8rem; color: #9aa6e0; text-align: center; padding: 0 14px 10px; }
</style>
</head>
<body>
<h1>BUZZER</h1>

<section id="pick">
  <div class="note">Wähle dein Team und tippe dann auf den großen Buzzer, sobald du die Antwort weißt.</div>
  <div class="row">
    <button class="choice t1" id="c1" type="button">Team 1</button>
    <button class="choice t2" id="c2" type="button">Team 2</button>
  </div>
  <div class="foot"><a href="../../">Zur Startseite</a></div>
</section>

<section id="play" class="hidden">
  <button id="big" type="button"><span id="label"></span><small id="state">Drücken!</small></button>
  <div class="foot"><button id="back" type="button">Team wechseln</button></div>
</section>

<script>
// Jedes Team hat ein eigenes Gerät und einen eigenen Klang: Team 1 zwei helle Töne (Ding-Ding), Team 2 ein tiefer Summton.
// Nach dem Drücken ist der Buzzer kurz gesperrt (SPERRE_MS), damit nicht mehrfach hintereinander gebuzzert wird.
const FARBE = { 1: "#e8743b", 2: "#2fa6c9" };
const SPERRE_MS = 3000;
const $ = id => document.getElementById(id);
let team = 0, ctx = null, locked = false, timer = null;

function audio() {
  try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); } catch (e) {}
}
function ton(freq, start, dur, type, vol) {
  const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + start;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur);
}
function klang(t) {
  audio(); if (!ctx) return;
  if (t === 1) { ton(1047, 0, .35, "sine", .5); ton(1568, .18, .5, "sine", .5); }       // Ding-Ding
  else { ton(150, 0, .7, "sawtooth", .4); ton(155, 0, .7, "square", .2); }              // tiefer Summer
}
function wahl(t) {
  team = t; audio();
  $("pick").classList.add("hidden"); $("play").classList.remove("hidden");
  $("big").style.background = FARBE[t];
  $("label").textContent = "TEAM " + t;
  frei();
}
function frei() { locked = false; clearTimeout(timer); $("big").disabled = false; $("state").textContent = "Drücken!"; }
function buzz() {
  if (locked || !team) return;
  locked = true; klang(team);
  try { navigator.vibrate && navigator.vibrate(150); } catch (e) {}
  $("big").disabled = true; $("state").textContent = "Gebuzzert!";
  timer = setTimeout(frei, SPERRE_MS);
}
$("c1").onclick = () => wahl(1); $("c2").onclick = () => wahl(2);
$("big").addEventListener("pointerdown", e => { e.preventDefault(); buzz(); });
$("back").onclick = () => { clearTimeout(timer); team = 0; $("play").classList.add("hidden"); $("pick").classList.remove("hidden"); };
</script>
</body>
</html>
